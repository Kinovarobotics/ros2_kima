# Builds and tests the repository against the released ROS 2 Jazzy binaries, the
# same way a user installs it: rosdep for released dependencies, plus the
# source-only dependencies listed in ros2_kima.jazzy.repos.
# Modeled on the binary build of Kinovarobotics/ros2_kortex (jazzy).
name: Jazzy Binary Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - main_dev
  schedule:
    # Nightly, to catch breakage from newly released dependencies.
    - cron: '17 4 * * *'

jobs:
  jazzy_binary:
    name: jazzy binary build (${{ matrix.env.ROS_REPO }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - {ROS_DISTRO: jazzy, ROS_REPO: main}
          - {ROS_DISTRO: jazzy, ROS_REPO: testing}
    env:
      # FZI cartesian_controllers is not released for Jazzy. Its MuJoCo simulation
      # and its tests are not used by this repository and are not built.
      UPSTREAM_WORKSPACE: >-
        ros2_kima.jazzy.repos
        -cartesian_controllers/cartesian_controller_simulation
        -cartesian_controllers/cartesian_controller_tests
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      BASEDIR: ${{ github.workspace }}/.work
      CACHE_PREFIX: ${{ matrix.env.ROS_DISTRO }}-${{ matrix.env.ROS_REPO }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.CACHE_PREFIX }}-${{ github.sha }}
            ccache-${{ env.CACHE_PREFIX }}
      - uses: ros-industrial/industrial_ci@master
        with:
          config: ${{ toJSON(matrix.env) }}
