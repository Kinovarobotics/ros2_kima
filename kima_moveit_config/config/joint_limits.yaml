# Joint limits used by MoveIt for trajectory time parametrization.
# Velocities match the URDF; accelerations match
# kortex_description/arms/kima/7dof/config/joint_limits.yaml.
# Position limits are taken from the URDF.

# Planning requests are scaled down by default: start slow on the real arm and
# raise the scaling factors from RViz or the request once motions are validated.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

joint_limits:
  joint_1:
    has_velocity_limits: true
    max_velocity: 3.142
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint_2:
    has_velocity_limits: true
    max_velocity: 3.142
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint_3:
    has_velocity_limits: true
    max_velocity: 4.712
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint_4:
    has_velocity_limits: true
    max_velocity: 4.712
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint_5:
    has_velocity_limits: true
    max_velocity: 6.284
    has_acceleration_limits: true
    max_acceleration: 10.0
  joint_6:
    has_velocity_limits: true
    max_velocity: 6.284
    has_acceleration_limits: true
    max_acceleration: 10.0
  joint_7:
    has_velocity_limits: true
    max_velocity: 6.284
    has_acceleration_limits: true
    max_acceleration: 10.0
