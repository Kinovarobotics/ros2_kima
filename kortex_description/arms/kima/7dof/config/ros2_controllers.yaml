/controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    twist_controller:
      type: picknik_twist_controller/PicknikTwistController

    fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController

    cartesian_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController

    motion_control_handle:
      type: cartesian_controller_handles/MotionControlHandle

/joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

/twist_controller:
  ros__parameters:
    joint: tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z

/cartesian_motion_controller:
  ros__parameters:
    # Tracks a target pose for tool_frame, published as geometry_msgs/PoseStamped on
    # ~/target_frame (the motion_control_handle publishes there from RViz).
    # FZI cartesian_controllers; the KIMA driver only exports position commands.
    robot_base_link: base_link
    end_effector_link: tool_frame
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    command_interfaces:
      - position
    solver:
      # Scales the Cartesian error fed to the solver: lower is slower and gentler.
      error_scale: 0.1
      iterations: 1
      publish_state_feedback: true
    pd_gains:
      trans_x: {p: 30.0, d: 2.5}
      trans_y: {p: 30.0, d: 2.5}
      trans_z: {p: 30.0, d: 2.5}
      rot_x: {p: 30.0, d: 2.5}
      rot_y: {p: 30.0, d: 2.5}
      rot_z: {p: 30.0, d: 2.5}

/motion_control_handle:
  ros__parameters:
    # Interactive marker in RViz that publishes the target pose for
    # cartesian_motion_controller (remapped onto its ~/target_frame by the bringup).
    robot_base_link: base_link
    end_effector_link: tool_frame
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
