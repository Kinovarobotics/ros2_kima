# Controllers for the Gazebo simulation (kortex_sim_control.launch.py).
#
# Same trajectory controller as the real arm (ros2_controllers.yaml),
# plus the Cartesian motion controller, minus fault_controller, which claims the
# reset_fault/* interfaces that only the KIMA EtherCAT driver exports.
# gz_ros2_control loads this file through the <gazebo> plugin in kinova.urdf.xacro.
controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    cartesian_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController

    motion_control_handle:
      type: cartesian_controller_handles/MotionControlHandle

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

cartesian_motion_controller:
  ros__parameters:
    # Tracks a target pose for tool_frame, published as geometry_msgs/PoseStamped on
    # ~/target_frame (the motion_control_handle publishes there from RViz).
    # FZI cartesian_controllers; the KIMA driver only exports position commands.
    robot_base_link: base_link
    end_effector_link: tool_frame
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    command_interfaces:
      - position
    solver:
      # Every cycle the controller resets its internal model to the measured joint
      # positions and simulates `iterations` steps of 0.02 s toward the target, then
      # commands the result. The real actuators lag the position command by a few
      # milliseconds, so a long look-ahead (e.g. 10 iterations = 0.2 s per 1 ms
      # cycle) overshoots and oscillates around the target. Read at configure time.
      iterations: 1
      # Scales the Cartesian error fed to the solver: lower is slower and gentler.
      # Read every cycle: tune live with `ros2 param set`.
      error_scale: 0.5
      publish_state_feedback: true
    # p: stiffness, d: damping on the change of the error. Read every cycle.
    pd_gains:
      trans_x: {p: 10.0, d: 0.0}
      trans_y: {p: 10.0, d: 0.0}
      trans_z: {p: 10.0, d: 0.0}
      rot_x: {p: 10.0, d: 0.0}
      rot_y: {p: 10.0, d: 0.0}
      rot_z: {p: 10.0, d: 0.0}

motion_control_handle:
  ros__parameters:
    # Interactive marker in RViz that publishes the target pose for
    # cartesian_motion_controller (remapped onto its ~/target_frame by the bringup).
    robot_base_link: base_link
    end_effector_link: tool_frame
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
